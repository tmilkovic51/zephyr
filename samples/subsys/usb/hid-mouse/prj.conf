CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_HID_SUPPORT=y

CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_HID_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

CONFIG_GPIO=y
CONFIG_INPUT=y

CONFIG_SAMPLE_USBD_MANUFACTURER="Logitech"
CONFIG_SAMPLE_USBD_PRODUCT="USB Receiver"
CONFIG_SAMPLE_USBD_SELF_POWERED=n
CONFIG_SAMPLE_USBD_MAX_POWER=50
CONFIG_SAMPLE_USBD_20_EXTENSION_DESC=y

# Zephyr default VID/PID
CONFIG_SAMPLE_USBD_VID=0x2fe3
CONFIG_SAMPLE_USBD_PID=0x0001

# Modified VID/PID
#CONFIG_SAMPLE_USBD_VID=0x046d
#CONFIG_SAMPLE_USBD_PID=0xc52b
